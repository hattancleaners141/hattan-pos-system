function v2TimesheetHTML(){
  const rows=state.staff.map(s=>{const logs=state.clockLog.filter(r=>r.staffName===s.name);const h=logs.reduce((sum,r)=>sum+v2HoursBetween(r.clockIn,r.clockOut),0);return `<tr><td>${s.name}</td><td>${h.toFixed(2)}</td><td>${money(s.payRate||0)}</td><td>${money(h*(s.payRate||0))}</td></tr>`}).join('');
  return `<h1>Hattan Cleaners — Timesheet</h1><p>Generated ${new Date().toLocaleString()}</p><table border="1" cellspacing="0" cellpadding="8"><tr><th>Employee</th><th>Hours</th><th>Rate</th><th>Est. Gross</th></tr>${rows}</table><p style="margin-top:40px">Employee signature: __________________________ &nbsp; Date: ____________</p>`;
}
function v2PrintTimesheet(){ const w=window.open('','_blank'); w.document.write(`<html><body style="font-family:Arial;padding:32px">${v2TimesheetHTML()}</body></html>`); w.document.close(); w.print(); }
function v2ShareTimesheet(kind){ recordSync(`Timesheet ${kind} signature request generated`); toast(`${kind==='email'?'Email':'Text'} signature request queued (prototype)`,true,kind==='email'?'send':'message'); }


/* -------- REPORTS -------- */
function renderPosReports(content) {
  state.reportFilters=state.reportFilters||{from:'',to:'',service:'all',building:'all',annualSpendMax:''};
  const f=state.reportFilters;
  const allBuildings=[...new Set(state.orders.map(v6OrderBuilding))].sort();
  let rows=[...state.orders];
  if(f.from) rows=rows.filter(o=>!o.createdAt || new Date(o.createdAt)>=new Date(f.from+'T00:00:00'));
  if(f.to) rows=rows.filter(o=>!o.createdAt || new Date(o.createdAt)<=new Date(f.to+'T23:59:59'));
  if(f.service!=='all') rows=rows.filter(o=>(o.itemsDetail||[]).some(it=>v5ServiceKeyForItem(it)===f.service));
  if(f.building!=='all') rows=rows.filter(o=>v6OrderBuilding(o)===f.building);
  if(f.annualSpendMax){
    const cap=parseFloat(f.annualSpendMax);
    rows=rows.filter(o=>{const c=o.customerId?customerById(o.customerId):null; return !c || v6CustomerAnnualSpend(c)<=cap;});
  }
  const paid=rows.filter(o=>o.paid);
  const sales=paid.reduce((s,o)=>s+(o.total-(o.discount||0)+(o.surcharge||0)),0);
  const avg=paid.length?sales/paid.length:0;
  const serviceBreak=['dryclean','washfold','shirts','alterations'].map(k=>{
    const orders=rows.filter(o=>(o.itemsDetail||[]).some(it=>v5ServiceKeyForItem(it)===k));
    return {k,count:orders.length,revenue:orders.reduce((s,o)=>s+(o.total||0),0)};
  });
  content.innerHTML=`
    <div class="pos-card">
      <div class="v6-section-title"><h3 style="margin:0">Report Filters</h3><button class="btn btn-ghost btn-sm" onclick="state.reportFilters={from:'',to:'',service:'all',building:'all',annualSpendMax:''};renderPosContent()">Reset</button></div>
      <div class="v6-report-filters">
        <div><span class="field-label">From</span><input class="text-input" type="date" value="${f.from}" onchange="state.reportFilters.from=this.value;renderPosContent()"></div>
        <div><span class="field-label">To</span><input class="text-input" type="date" value="${f.to}" onchange="state.reportFilters.to=this.value;renderPosContent()"></div>
        <div><span class="field-label">Service Type</span><select class="text-input" onchange="state.reportFilters.service=this.value;renderPosContent()"><option value="all">All Services</option>${['dryclean','washfold','shirts','alterations'].map(k=>`<option value="${k}" ${f.service===k?'selected':''}>${v5ServiceLabel(k)}</option>`).join('')}</select></div>
        <div><span class="field-label">Building</span><select class="text-input" onchange="state.reportFilters.building=this.value;renderPosContent()"><option value="all">All Buildings</option>${allBuildings.map(b=>`<option ${f.building===b?'selected':''}>${esc(b)}</option>`).join('')}</select></div>
        <div><span class="field-label">Annual Spend Under</span><input class="text-input" type="number" placeholder="e.g. 1000" value="${f.annualSpendMax}" oninput="state.reportFilters.annualSpendMax=this.value;renderPosContent()"></div>
      </div>
    </div>
    <div class="v2-grid">
      <div class="v2-kpi"><small>Filtered Sales</small><strong>${money(sales)}</strong></div>
      <div class="v2-kpi"><small>Transactions</small><strong>${paid.length}</strong></div>
      <div class="v2-kpi"><small>Average Ticket</small><strong>${money(avg)}</strong></div>
      <div class="v2-kpi"><small>Orders</small><strong>${rows.length}</strong></div>
    </div>
    <div class="pos-card"><h3>Service Breakdown</h3><table class="pos-table"><thead><tr><th>Service</th><th>Orders</th><th>Order Revenue</th></tr></thead><tbody>${serviceBreak.map(x=>`<tr><td><strong>${v5ServiceLabel(x.k)}</strong></td><td>${x.count}</td><td>${money(x.revenue)}</td></tr>`).join('')}</tbody></table></div>
    <div class="pos-card"><h3>Filtered Orders</h3><table class="pos-table"><thead><tr><th>Customer</th><th>Ticket</th><th>Building</th><th>Total</th><th>Status</th></tr></thead><tbody>${rows.map(o=>`<tr><td>${esc(customerLabel(o))}</td><td>${o.channel==='counter'?'#'+o.ticket:o.id}</td><td>${esc(v6OrderBuilding(o))}</td><td>${money(o.total||0)}</td><td>${o.status||'—'}</td></tr>`).join('')}</tbody></table></div>`;
}
function posUpdateVariance(expected) {
  const counted = parseFloat(document.getElementById('rc-counted').value);
  const el = document.getElementById('rc-variance');
  if (isNaN(counted)) { el.textContent = '—'; el.style.color = 'var(--ink-primary)'; return; }
  const variance = counted - expected;
  el.textContent = (variance >= 0 ? '+' : '') + money(variance);
  el.style.color = Math.abs(variance) < 0.01 ? 'var(--status-good)' : 'var(--status-critical)';
}

/* ============================================================================
   ============================  DRIVER APP  ==================================
   Amazon-Flex-style delivery driver view: sign in, see today's route (pickups
   & drop-offs assigned to you), capture a photo at each stop, and mark it
   picked up or delivered. Shares the exact same order data as the POS.
============================================================================ */
let driverLoginDraft = { driverId: null, pin: '' };

function renderDriverRoot() {
  if (!state.driverSession.loggedIn) { renderDriverLogin(); return; }
  const root = document.getElementById('driver-root'); if (!root) return;
  root.innerHTML = driverShellHTML();
  renderDriverContent();
  renderConnPills();
}
function renderDriverLogin() {
  const root = document.getElementById('driver-root'); if (!root) return;
  root.innerHTML = driverLoginHTML();
  renderConnPills();
}
function driverLoginHTML() {
  const selected = driverLoginDraft.driverId ? driverById(driverLoginDraft.driverId) : null;
  return `
  <div class="pos-login-wrap" style="position:relative;">
    <span class="conn-pill-slot" style="position:absolute;top:16px;right:16px;">${connPillHTML()}</span>
    <div class="pos-login-card">
      <div class="logo-mark" style="width:44px;height:44px;margin:0 auto 14px;"></div>
      <h2 style="text-align:center;margin-bottom:2px;">Driver Sign In</h2>
      <p class="pm-sub" style="text-align:center;margin-bottom:20px;">Hattan Cleaners · Delivery</p>
      ${!selected ? `
        <span class="field-label">Select your name</span>
        <div class="staff-grid">
          ${state.drivers.map(d => `<div class="staff-pick" onclick="driverSelect('${d.id}')"><div class="avatar">${d.initials}</div><div><strong>${d.name}</strong><span>${d.vehicle}</span></div></div>`).join('')}
        </div>
      ` : `
        <div class="staff-pick selected" style="margin-bottom:16px;"><div class="avatar">${selected.initials}</div><div><strong>${selected.name}</strong><span>${selected.vehicle}</span></div></div>
        <span class="field-label">Enter PIN</span>
        <div class="pin-dots">${[0, 1, 2, 3].map(i => `<i class="${i < driverLoginDraft.pin.length ? 'filled' : ''}"></i>`).join('')}</div>
        <div class="pin-pad">
          ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button onclick="driverPinPress('${n}')">${n}</button>`).join('')}
          <button onclick="driverSelect(null)">${icon('chevronleft', 16)}</button>
          <button onclick="driverPinPress('0')">0</button>
          <button onclick="driverPinBack()">${icon('x', 16)}</button>
        </div>
      `}
    </div>
  </div>`;
}
function driverSelect(id) { driverLoginDraft = { driverId: id, pin: '' }; renderDriverLogin(); }
function driverPinPress(d) {
  if (driverLoginDraft.pin.length >= 4) return;
  driverLoginDraft.pin += d;
  if (driverLoginDraft.pin.length === 4) checkDriverPin();
  else renderDriverLogin();
}
function driverPinBack() { driverLoginDraft.pin = driverLoginDraft.pin.slice(0, -1); renderDriverLogin(); }
function checkDriverPin() {
  const d = driverById(driverLoginDraft.driverId);
  if (d && d.pin === driverLoginDraft.pin) {
    state.driverSession = { loggedIn: true, driverId: d.id };
    state.driverNav = 'route';
    saveState();
    toast(`Welcome, ${d.name.split(' ')[0]}`, true, 'truck');
    renderDriverRoot();
  } else {
    toast('Incorrect PIN', false, 'alerttriangle');
    driverLoginDraft.pin = '';
    renderDriverLogin();
  }
}
function driverSignOut() {
  state.driverSession = { loggedIn: false, driverId: null };
  driverLoginDraft = { driverId: null, pin: '' };
  saveState();
  renderDriverRoot();
}
function driverShellHTML() {
  const d = driverById(state.driverSession.driverId);
  return `
  <div class="pos-shell">
    <div class="pos-main" style="width:100%;">
      <div class="pos-topbar">
        <div><h1>My Route</h1><div class="pt-sub">${d.name} · ${d.vehicle} · ${todayLabel()}</div></div>
        <div class="pos-topbar-right">
          <span class="conn-pill-slot">${connPillHTML()}</span>
          <button class="pos-signout" style="color:var(--ink-secondary);width:auto;" onclick="driverSignOut()">${icon('logout', 14)} Sign Out</button>
        </div>
      </div>
      <div class="pos-content" id="driver-content"></div>
    </div>
  </div>`;
}
function renderDriverContent() {
  const content = document.getElementById('driver-content'); if (!content) return;
  const d = driverById(state.driverSession.driverId);
  const myOrders = state.orders.filter(o => o.channel === 'delivery' && o.assignedDriverId === d.id);
  const pickups = myOrders.filter(o => o.status === 'scheduled');
  const dropoffs = myOrders.filter(o => o.status === 'out_for_delivery');
  const upNext = myOrders.filter(o => ['picked_up', 'in_cleaning', 'ready'].includes(o.status));
  const done = myOrders.filter(o => o.status === 'delivered');

  content.innerHTML = `
    <div class="stat-row">
      <div class="stat-tile"><div class="st-label">Pickups Today</div><div class="st-value">${pickups.length}</div></div>
      <div class="stat-tile"><div class="st-label">Out for Delivery</div><div class="st-value">${dropoffs.length}</div></div>
      <div class="stat-tile"><div class="st-label">Completed</div><div class="st-value">${done.length}</div></div>
    </div>
    ${pickups.length ? `<div class="pos-card"><h3>${icon('mappin', 16)} Pickups</h3>${pickups.map(driverStopCardHTML).join('')}</div>` : ''}
    ${dropoffs.length ? `<div class="pos-card"><h3>${icon('navigation', 16)} Out for Delivery</h3>${dropoffs.map(driverStopCardHTML).join('')}</div>` : ''}
    ${upNext.length ? `<div class="pos-card"><h3>${icon('clock', 16)} In Progress</h3>${upNext.map(driverStopCardHTML).join('')}</div>` : ''}
    ${done.length ? `<div class="pos-card"><h3>${icon('checkcircle', 16)} Completed Today</h3>${done.map(driverStopCardHTML).join('')}</div>` : ''}
    ${!myOrders.length ? `<div class="pos-card"><div class="table-empty">No stops assigned to you right now.</div></div>` : ''}
  `;
}
function driverStopCardHTML(o) {
  const cust = o.customerId ? customerById(o.customerId) : null;
  const addr = cust && o.address ? cust.addresses.find(a => a.id === o.address) : null;
  const isPickupLeg = o.status === 'scheduled';
  return `<div class="list-row" onclick="driverOpenStop('${o.id}')">
    <div class="row-icon">${icon(isPickupLeg ? 'mappin' : 'truck', 16)}</div>
    <div class="row-body">
      <div class="row-title">${esc(customerLabel(o))} <span style="font-weight:600;color:var(--ink-muted);">· ${o.id}</span></div>
      <div class="row-sub">${addr ? addr.line1 + ', ' + addr.line2 : 'Address on file'}${o.window ? ' · ' + o.window : ''}</div>
      <div class="row-sub">${esc(o.items)}</div>
    </div>
    <div class="row-trail">${icon('chevronright', 15)}</div>
  </div>`;
}
function driverOpenStop(orderId) {
  const o = state.orders.find(x => x.id === orderId); if (!o) return;
  const cust = o.customerId ? customerById(o.customerId) : null;
  const addr = cust && o.address ? cust.addresses.find(a => a.id === o.address) : null;
  const isPickupLeg = o.status === 'scheduled';
  const isDropoffLeg = o.status === 'out_for_delivery';
  const photoKey = isPickupLeg ? 'garmentPhotos' : 'deliveryPhotos';
  openDriverModal(`
    <h3>${esc(customerLabel(o))}</h3>
    <p class="pm-sub">${o.id} · ${addr ? addr.line1 + ', ' + addr.line2 : 'No address on file'}</p>
    <div class="pos-card" style="padding:14px;margin-bottom:14px;">
      <div class="price-line"><span>${esc(o.items)}</span><span>${money(o.total)}</span></div>
      ${o.window ? `<div class="price-line"><span>Window</span><span>${o.window}</span></div>` : ''}
      ${cust ? `<div class="price-line"><span>Phone</span><span>${cust.phone}</span></div>` : ''}
    </div>
    <span class="field-label">${isPickupLeg ? 'Pickup Photo' : 'Delivery Proof Photo'} — scan to confirm (${(o[photoKey] || []).length})</span>
    <div class="photo-grid" style="margin-bottom:16px;">
      ${(o[photoKey] || []).map(p => photoThumbHTML(p, null)).join('')}
      <label class="photo-add-btn">${icon('camera', 20)}<span>Scan</span><input type="file" accept="image/*" capture="environment" style="display:none;" onchange="driverCapturePhoto(event,'${o.id}','${isPickupLeg ? 'garment' : 'delivery'}')" /></label>
    </div>
    ${isPickupLeg ? `<button class="btn btn-primary btn-block" onclick="driverMarkPickedUp('${o.id}')">${icon('checkcircle', 16)} Confirm Pickup</button>` : ''}
    ${isDropoffLeg ? `<button class="btn btn-primary btn-block" onclick="driverMarkDelivered('${o.id}')">${icon('checkcircle', 16)} Confirm Delivery</button>` : ''}
    ${!isPickupLeg && !isDropoffLeg ? `<div class="warn-banner">${icon('clock', 15)}<span>Still in production at the store — nothing to confirm at this stop yet.</span></div>` : ''}
    <button class="btn btn-ghost btn-block" style="margin-top:8px;" onclick="closeDriverModal()">Close</button>
  `);
}
function driverCapturePhoto(evt, orderId, type) {
  const file = evt.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const o = state.orders.find(x => x.id === orderId); if (!o) return;
    const key = type === 'garment' ? 'garmentPhotos' : 'deliveryPhotos';
    if (!o[key]) o[key] = [];
    o[key].push({ id: uid('ph_'), dataUrl: reader.result, caption: '', timestamp: new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }), type });
    recordSync(`Driver photo added · ${o.id}`);
    toast('Photo captured', true, 'camera');
    driverOpenStop(orderId);
  };
  reader.readAsDataURL(file);
}
function driverMarkPickedUp(orderId) {
  const o = state.orders.find(x => x.id === orderId); if (!o) return;
  const idx = DELIVERY_STAGES.findIndex(s => s.id === 'picked_up');
  o.stageIndex = idx; o.status = 'picked_up';
  recordSync(`Picked up · ${o.id}`);
  toast(`${o.id} marked picked up`, true, 'checkcircle');
  closeDriverModal();
  renderDriverContent();
}
function driverMarkDelivered(orderId) {
  const o = state.orders.find(x => x.id === orderId); if (!o) return;
  const idx = DELIVERY_STAGES.findIndex(s => s.id === 'delivered');
  o.stageIndex = idx; o.status = 'delivered';
  recordSync(`Delivered · ${o.id}`);
  toast(`${o.id} marked delivered`, true, 'checkcircle');
  closeDriverModal();
  renderDriverContent();
}
function openDriverModal(html) {
  document.getElementById('driver-modal').innerHTML = html;
  document.getElementById('driver-modal-overlay').classList.add('show');
}
function closeDriverModal() {
  document.getElementById('driver-modal-overlay').classList.remove('show');
}

});
